version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/examples"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /examples/catalog
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      docker-images:
        patterns: ["*"]
