name: Bug report
description: Something works differently from the documentation or from nestjs-paginate.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not open an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: go-paginate version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: executor
    attributes:
      label: Executor
      options:
        - gormx
        - squirrelx
        - my own, on paginate.Prepare
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: The query string, decoded.
      placeholder: /users?page=2&limit=10&filter=status=$in:active,invited
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The paginate.Config of the endpoint (column names may be anonymized).
      render: go
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
      description: Include the SQL from squirrelx.Statements or paginate.Prepare if you have it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Go and Postgres versions
      placeholder: Go 1.27.3, Postgres 17
