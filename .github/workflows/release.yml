name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Test
        run: go test ./...
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for ${version}: the release gets the generated notes only."
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # --notes goes before the notes GitHub generates from the merged pull requests.
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" --notes "$(cat notes.md)"
      - name: Announce the version to the Go module proxy and pkg.go.dev
        run: curl -fsS "https://proxy.golang.org/github.com/svyatoslavratov/go-paginate/@v/${GITHUB_REF_NAME}.info"
